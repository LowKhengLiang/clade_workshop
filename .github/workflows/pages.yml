name: CI/CD - Validate and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check inline script
        run: |
          awk '/<script>/{f=1;next} /<\/script>/{f=0} f' index.html > "$RUNNER_TEMP/app.js"
          node --check "$RUNNER_TEMP/app.js"

      - name: Enforce project constraints
        run: |
          fail=0
          if grep -nE 'localStorage|sessionStorage|indexedDB|document\.cookie' index.html; then
            echo "::error::Persistence APIs are not allowed"; fail=1
          fi
          if grep -n '!important' index.html; then
            echo "::error::!important is not allowed"; fail=1
          fi
          if grep -nE 'https?://' index.html | grep -vE 'formsubmit\.co|wa\.me'; then
            echo "::error::Only FormSubmit (endpoint + CSP) and the wa.me WhatsApp link may be external URLs"; fail=1
          fi
          exit $fail

      - name: Require Content-Security-Policy
        run: grep -q 'http-equiv="Content-Security-Policy"' index.html || { echo "::error::CSP meta tag missing"; exit 1; }

      - name: Secret scan
        run: |
          if grep -rnIE --exclude-dir=.git --exclude-dir=.claude --exclude=pages.yml 'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|github_pat_|xox[baprs]-|AIza[0-9A-Za-z_-]{20,}|BEGIN [A-Z ]*PRIVATE KEY' .; then
            echo "::error::Possible secret found"; exit 1
          fi

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: mkdir _site && cp index.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
